name: AI Tech Flow Studio — Android Test APK
on:
  push:
    branches:
      - flow-studio-apk-test
    paths:
      - 'flow-studio-test/**'
      - '.github/workflows/flow-studio-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build installable Debug APK
        working-directory: flow-studio-test
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and certificate
        run: |
          APK="flow-studio-test/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"
      - name: APK Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Tech-Flow-Studio-v0.1.3-TEST-APK
          path: flow-studio-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
