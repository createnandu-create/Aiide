name: Build Telugu Offline TTS Debug APK
on:
  push:
    branches: [telugu-voice-testing]
    paths:
      - 'offline-tts-android/**'
      - '.github/workflows/offline-tts-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android 35 with runner SDK
        run: |
          echo "SDK root: ${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build debug APK
        run: gradle --no-daemon --project-dir offline-tts-android :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguOfflineVoice-debug-apk
          path: offline-tts-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
